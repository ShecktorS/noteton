name: Release

# Si attiva quando viene pushato un tag versione (es. v0.10.1).
# Builda l'APK di release firmato e pubblica una GitHub Release con l'asset.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # necessario per creare la release e caricare l'asset

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Ricostruisci la keystore dai secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # tr -d rimuove eventuali spazi/a-capo introdotti dal copia-incolla del secret
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/noteton-release.p12
          # Validazione completa: estrae anche la chiave, cosi' verifica che la
          # password apra sia lo store SIA la chiave (in un PKCS12 coincidono).
          if ! openssl pkcs12 -in android/noteton-release.p12 -nodes -passin pass:"$STORE_PASSWORD" -noout 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 non valido o STORE_PASSWORD errata: la keystore non e' apribile."
            echo "Byte decodificati: $(wc -c < android/noteton-release.p12) (atteso ~2500). Probabile secret troncato o password sbagliata."
            exit 1
          fi
          echo "Keystore valida: $(wc -c < android/noteton-release.p12) byte."
          # In PKCS12 la password della chiave e' SEMPRE uguale a quella dello store:
          # usiamo STORE_PASSWORD per entrambe, cosi' non serve il secret KEY_PASSWORD.
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=noteton-release.p12
          EOF

      - name: Estrai la versione dal tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Rileva automaticamente se è una pre-release (beta, alpha, rc)
          if [[ "$VERSION" =~ -(beta|alpha|rc) ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Installa le dipendenze
        run: flutter pub get

      - name: Build APK di release
        run: flutter build apk --release

      - name: Rinomina l'APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             dist/Noteton-${{ steps.version.outputs.version }}.apk

      - name: Pubblica la Release
        uses: softprops/action-gh-release@v2
        with:
          name: Noteton ${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          generate_release_notes: true
          files: dist/Noteton-${{ steps.version.outputs.version }}.apk

      - name: Pulizia segreti
        if: always()
        run: rm -f android/noteton-release.p12 android/key.properties
